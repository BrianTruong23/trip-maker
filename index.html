<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twenty-six hours in Boston</title>
  <meta name="description" content="A readable, interactive map of Newbury Street hotels and places within a 26-hour Boston itinerary.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">A walkable Boston weekend</p>
      <h1>Twenty-six hours in Boston</h1>
      <p class="subtitle">Find the Newbury Street stops first, then follow the full route.</p>
    </div>
    <nav class="days" id="day-filters" aria-label="Filter map locations"></nav>
  </header>

  <main class="stage">
    <div id="map" role="region" aria-label="Map of hotels and itinerary places around Boston"></div>
    <div class="map-status" id="map-status" role="status">Loading map…</div>

    <article class="place-card" id="place-card" hidden></article>

    <div class="map-tools">
      <div class="zoom-bar" aria-label="Map zoom controls">
        <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
        <span id="zoom-label" aria-live="polite">Zoom —</span>
        <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
      </div>
      <button class="reset-view" type="button" id="reset-view">Fit locations</button>
    </div>

    <aside class="map-legend" aria-label="Map marker legend">
      <span><i class="legend-pin legend-pin-place" aria-hidden="true">1</i> Place</span>
      <span><i class="legend-pin legend-pin-hotel" aria-hidden="true">H</i> Hotel</span>
    </aside>

    <div class="scrubber">
      <p class="scrub-label" id="scrub-label">Itinerary</p>
      <div class="scrub-nav">
        <button type="button" id="prev" aria-label="Previous stop">‹</button>
        <button type="button" id="next" aria-label="Next stop">›</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="script.js"></script>
</body>
</html>
